<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T2">
<meta name="theme-color" content="#0e1116">
<meta name="format-detection" content="telephone=no">
<title>T2 · 技术面</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="style.css?v=v7">
</head>
<body>

<header class="topbar">
  <div class="searchwrap">
    <input id="q" type="search" placeholder="代码 / 中文 / 拼音"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clr" class="clr" aria-label="清空">✕</button>
  </div>
  <div id="suggest" class="suggest" hidden></div>
</header>

<main id="main">
  <section class="empty" id="boot">
    <div class="spinner"></div>
    <p>启动中…</p>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bd"></div>
  <div class="sheet-panel"></div>
</div>

<div id="errbar" class="errbar" hidden></div>

<noscript><p style="padding:20px;color:#ffb020">需要启用 JavaScript</p></noscript>

<script>
/* 全局错误浮层 */
(function () {
  var bar = document.getElementById('errbar');
  var shown = 0;
  function show(msg, extra) {
    if (shown++ > 4) return;
    bar.hidden = false;
    bar.innerHTML += '<div><b>错误</b>：' + String(msg).replace(/[<>&]/g, '') +
      (extra ? '<br><span style="color:#8b95a5;font-size:11px">' + String(extra).replace(/[<>&]/g, '').slice(0, 200) + '</span>' : '') + '</div>';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') show('脚本加载失败：' + (e.target.src || ''));
    else show(e.message || '未知错误', (e.filename || '') + ':' + (e.lineno || ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show((e.reason && e.reason.message) || e.reason || 'Promise 未处理');
  });

  /* 注册 Service Worker（本地 http 或线上 https 都可以） */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .catch(function (err) { console.warn('[T2] SW 注册失败', err); });
    });
  }
})();
</script>

<script src="app.js?v=v7"></script>
<script src="chart.js?v=v7"></script>
<script src="ui.js?v=v7"></script>
</body>
</html>
